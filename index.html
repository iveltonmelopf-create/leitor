<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1D20">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Leitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 000-18z" fill="currentColor"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 014 4v12a3 3 0 00-3-3H2zM22 4h-6a4 4 0 00-4 4v12a3 3 0 013-3h7z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6M3 13a9 9 0 109-9 9.5 9.5 0 00-6.7 2.7"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  </defs>
</svg>

<div id="lib" class="screen">
  <header class="bar">
    <h1>Biblioteca</h1>
    <input id="q" type="search" placeholder="Buscar livro" aria-label="Buscar livro">
    <button id="bDisc" class="ic" title="Descobrir livros (mais vendidos)" aria-label="Descobrir"><svg><use href="#i-book"/></svg></button>
    <button id="bSync" class="ic" title="Atualizar do Drive" aria-label="Atualizar"><svg><use href="#i-sync"/></svg></button>
    <button id="bLocal" class="ic" title="Abrir arquivo deste aparelho" aria-label="Abrir arquivo"><svg><use href="#i-plus"/></svg></button>
    <button id="bSet" class="ic" title="Configurações" aria-label="Configurações"><svg><use href="#i-sliders"/></svg></button>
  </header>
  <div id="tabs" role="tablist"><button data-tab="lendo" role="tab">Lendo<span></span></button><button data-tab="estante" role="tab">Estante<span></span></button></div>
  <div id="banner" hidden></div>
  <main id="grid"></main>
  <input id="fileIn" type="file" accept=".epub,.pdf,.mobi,.azw3,.azw,.prc,application/epub+zip,application/pdf" hidden>
</div>

<div id="reader" class="screen" hidden>
  <header class="bar rbar">
    <button id="rBack" class="ic" title="Voltar" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <span id="rTitle"></span>
    <button id="rToc" class="ic" title="Sumário" aria-label="Sumário"><svg><use href="#i-list"/></svg></button>
    <button id="rNotes" class="ic" title="Destaques e notas" aria-label="Destaques e notas"><svg><use href="#i-note"/></svg></button>
    <button id="rInk" class="ic" title="Caneta" aria-label="Caneta" hidden><svg><use href="#i-pen"/></svg></button>
    <button id="rFull" class="ic" title="Tela cheia (esconder botões)" aria-label="Tela cheia"><svg><use href="#i-expand"/></svg></button>
    <button id="rTheme" class="ic" title="Trocar fundo (claro / sépia / escuro / preto)" aria-label="Trocar fundo"><svg><use href="#i-contrast"/></svg></button>
    <button id="rSet" class="ic txt" title="Aparência e leitura" aria-label="Aparência e leitura">Aa</button>
  </header>
  <div id="inkbar" hidden>
    <button data-tool="pen" class="tool">Caneta</button>
    <button data-tool="mk" class="tool">Marca-texto</button>
    <button data-tool="er" class="tool">Borracha</button>
    <span id="inkColors"></span>
    <button data-size="1" class="sz" aria-label="Fino"><i style="--d:4px"></i></button>
    <button data-size="2" class="sz" aria-label="Médio"><i style="--d:8px"></i></button>
    <button data-size="3" class="sz" aria-label="Grosso"><i style="--d:14px"></i></button>
    <button id="inkUndo" class="ic" title="Desfazer" aria-label="Desfazer"><svg><use href="#i-undo"/></svg></button>
    <label class="chk"><input type="checkbox" id="finger"> dedo desenha</label>
  </div>
  <div id="stage">
    <div id="viewer"></div>
    <div id="pdfWrap" hidden>
      <div id="pdfPage"><div id="pdfInner">
        <canvas id="pdfCv"></canvas>
        <div id="hlLayer"></div>
        <div id="textLayer"></div>
        <canvas id="inkCv"></canvas>
      </div></div>
    </div>
    <div id="mini"></div>
    <button class="edge l" id="prev" aria-label="Página anterior"><svg><use href="#i-left"/></svg></button>
    <button class="edge r" id="next" aria-label="Próxima página"><svg><use href="#i-right"/></svg></button>
  </div>
  <footer class="rfoot">
    <input type="range" id="slider" min="0" max="1000" value="0" aria-label="Posição no livro">
    <span id="pos"></span>
    <span id="zoomBtns" hidden>
      <button id="zOut" class="ic" aria-label="Diminuir"><svg><use href="#i-minus"/></svg></button>
      <button id="zIn" class="ic" aria-label="Aumentar"><svg><use href="#i-plus"/></svg></button>
    </span>
  </footer>
  <div id="sheet" hidden>
    <span class="dots"></span>
    <button id="shNote">Nota</button>
    <button id="shCopy">Copiar</button>
    <button id="shX" class="ic" aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
  </div>
</div>

<div id="disc" class="screen" hidden>
  <header class="bar">
    <button id="dBack" class="ic" title="Voltar" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <h1>Descobrir</h1>
    <input id="dq" type="search" placeholder="Título, autor ou assunto" aria-label="Buscar no catálogo">
  </header>
  <div id="dcats"></div>
  <main id="dlist"></main>
</div>

<aside id="panel" hidden></aside>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<div id="night" aria-hidden="true"><i class="warm"></i><i class="dim"></i></div>

<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
<script src="pdf.min.js"></script>
<script src="catalogo.js"></script>
<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.gisReady&&window.gisReady()"></script>
</body>
</html>
