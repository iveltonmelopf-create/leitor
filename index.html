<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Leitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

<div id="lib" class="screen">
  <header class="bar">
    <h1>Minha estante</h1>
    <input id="q" type="search" placeholder="Buscar livro">
    <button id="bDisc" title="Descobrir livros (mais vendidos)">📖</button>
    <button id="bSync" title="Atualizar do Drive">↻</button>
    <button id="bLocal" title="Abrir arquivo deste aparelho">＋</button>
    <button id="bSet" title="Configurações">⚙</button>
  </header>
  <div id="banner" hidden></div>
  <main id="grid"></main>
  <input id="fileIn" type="file" accept=".epub,.pdf,.mobi,.azw3,.azw,.prc,application/epub+zip,application/pdf" hidden>
</div>

<div id="reader" class="screen" hidden>
  <header class="bar rbar">
    <button id="rBack" title="Voltar">←</button>
    <span id="rTitle"></span>
    <button id="rToc" title="Sumário">☰</button>
    <button id="rNotes" title="Destaques e notas">✎</button>
    <button id="rInk" title="Caneta" hidden>🖊</button>
    <button id="rTheme" title="Trocar fundo (claro / sépia / escuro / preto)">◐</button>
    <button id="rSet" title="Aparência">Aa</button>
  </header>
  <div id="inkbar" hidden>
    <button data-tool="pen" class="tool">Caneta</button>
    <button data-tool="mk" class="tool">Marca-texto</button>
    <button data-tool="er" class="tool">Borracha</button>
    <span id="inkColors"></span>
    <button data-size="1" class="sz">·</button>
    <button data-size="2" class="sz">●</button>
    <button data-size="3" class="sz big">⬤</button>
    <button id="inkUndo" title="Desfazer">↶</button>
    <label class="chk"><input type="checkbox" id="finger"> dedo desenha</label>
  </div>
  <div id="stage">
    <div id="viewer"></div>
    <div id="pdfWrap" hidden>
      <div id="pdfPage">
        <canvas id="pdfCv"></canvas>
        <div id="hlLayer"></div>
        <div id="textLayer"></div>
        <canvas id="inkCv"></canvas>
      </div>
    </div>
    <button class="edge l" id="prev">‹</button>
    <button class="edge r" id="next">›</button>
  </div>
  <footer class="rfoot">
    <input type="range" id="slider" min="0" max="1000" value="0">
    <span id="pos"></span>
    <span id="zoomBtns" hidden><button id="zOut">−</button><button id="zIn">＋</button></span>
  </footer>
  <div id="sheet" hidden>
    <span class="dots"></span>
    <button id="shNote">Nota</button>
    <button id="shCopy">Copiar</button>
    <button id="shX">✕</button>
  </div>
</div>

<div id="disc" class="screen" hidden>
  <header class="bar">
    <button id="dBack" title="Voltar">←</button>
    <h1>Descobrir</h1>
    <input id="dq" type="search" placeholder="Título, autor ou assunto">
  </header>
  <div id="dcats"></div>
  <main id="dlist"></main>
</div>

<aside id="panel" hidden></aside>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
<script src="pdf.min.js"></script>
<script src="catalogo.js"></script>
<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.gisReady&&window.gisReady()"></script>
</body>
</html>
